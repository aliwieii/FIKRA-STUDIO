name: FIKRA STUDIO V3.1.1 Continuous Forensic QA

on:
  push:
    branches: [ "fix/v3.1-production-readiness", "development/v3.0", "main" ]
  pull_request:
    branches: [ "main", "development/v3.0" ]

permissions:
  contents: read

jobs:
  python-and-media-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run full Python + FFmpeg + Regression + Integrity test suite
        run: python3 -m unittest discover -s tests -v
      - name: Run Automatic Integrity Validator
        run: python3 -m fikra_v3 integrity
      - name: Run Regression Guard
        run: python3 -m fikra_v3 regression
      - name: Validate Remotion timeline (Node.js)
        run: node 08_PROJECT_ASSETS/CODE_AND_SCRIPTS/MOTALIM_REMOTION_VIDEO_TEMPLATE/scripts/validate-timeline.mjs

  remotion-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - 08_PROJECT_ASSETS/CODE_AND_SCRIPTS/MOTALIM_REMOTION_VIDEO_TEMPLATE
          - 08_PROJECT_ASSETS/CODE_AND_SCRIPTS/MOTALIM_REMOTION_LOGO_PROJECT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies & run TypeScript typecheck
        working-directory: ${{ matrix.project }}
        run: npm install --no-audit --no-fund && npm run typecheck
